# Render Blueprint: a plain Static Site (React files only, no server).
# The voter data in web/public/data/*.bin is encrypted with your password (bash run.sh does this).
services:
  - type: web
    name: kphb-voter-atlas
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
